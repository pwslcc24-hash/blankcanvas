name: Backtest strategies

# Runs the full strategy grid (~20 variants) against 30 days of synced history.
# Scheduled weekly; also runnable manually from GitHub Actions.
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      BASE44_APP_ID: "6a71456255306fb44df3f700"
      BASE44_BOT_EMAIL: ${{ secrets.BASE44_BOT_EMAIL }}
      BASE44_BOT_PASSWORD: ${{ secrets.BASE44_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install "@base44/sdk@^0.8.0"
        working-directory: .github/scripts
      - run: node run-scheduled-task.mjs backtest-strategies
        working-directory: .github/scripts
