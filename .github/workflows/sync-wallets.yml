name: Sync tracked wallets

# Base44 has no built-in cron, so this workflow is the scheduler. It logs in as
# a dedicated bot account and pulls fresh activity/positions for tracked
# wallets, recomputes scores, detects consensus, and runs paper trades.
#
# Schedule: every 30 minutes. Each run only syncs/scores a slice of wallets
# (~5–8 min) so runs finish before the next one and stay under API limits.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-wallets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE44_APP_ID: "6a71456255306fb44df3f700"
      BASE44_BOT_EMAIL: ${{ secrets.BASE44_BOT_EMAIL }}
      BASE44_BOT_PASSWORD: ${{ secrets.BASE44_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install "@base44/sdk@^0.8.0"
        working-directory: .github/scripts
      - run: node run-scheduled-task.mjs sync-batch score-batch detect-consensus run-paper-trades
        working-directory: .github/scripts
