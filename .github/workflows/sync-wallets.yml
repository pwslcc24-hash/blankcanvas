name: Sync tracked wallets

# Base44 has no built-in cron, so this workflow is the scheduler: every 30
# minutes it logs into the app as a dedicated bot account (Base44 apps set to
# "private" require a real session for every request, including function
# calls) and asks it to pull fresh activity/positions for all tracked wallets,
# then recompute skill scores.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BASE44_APP_ID: "6a71456255306fb44df3f700"
      BASE44_BOT_EMAIL: ${{ secrets.BASE44_BOT_EMAIL }}
      BASE44_BOT_PASSWORD: ${{ secrets.BASE44_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install "@base44/sdk@^0.8.0"
        working-directory: .github/scripts
      - run: node run-scheduled-task.mjs sync-batch score-batch
        working-directory: .github/scripts
